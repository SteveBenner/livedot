[package]
name = "livedot"
version = "0.13.0"
edition = "2024"
rust-version = "1.87"
description = "A red, yellow or green dot for each service you care about, with start, stop and restart"
license = "MIT"
readme = "README.md"

[dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
libc = "0.2.190"
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
ureq = "3.4.2"
zbus = "5"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
ksni = { path = "vendor/ksni" }
